services:
  careershield:
    build: .
    container_name: careershield-ai-demo
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
